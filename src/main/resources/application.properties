spring.application.name=codeRank
server.port=8083

# Database Configuration
spring.datasource.url=jdbc:mariadb://localhost:3306/coderank?createDatabaseIfNotExist=true&useInformationSchema=true
spring.datasource.username=root
spring.datasource.password=#####
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JMX Configuration (disable to remove RMI warnings)
spring.jmx.enabled=false

#JWT Configuration
jwt.secret=#######
jwt.expiration=86400000

## Rate Limiting
ratelimit.executions.per.hour=20

# Docker Configuration
docker.host=######

# Execution Limits
execution.timeout.default=5000
execution.timeout.max=30000
execution.memory.default=128
execution.memory.max=512

